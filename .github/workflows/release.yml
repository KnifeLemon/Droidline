name: release

# Add a section to CHANGELOG.md, then push a tag like v0.1.0. Binaries, the signed APK and checksums go to a
# published GitHub release titled "Droidline <version>"; the SDKs go to PyPI and npm; the relay image goes to GHCR.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            out="droidline_${VERSION}_${os}_${arch}"
            mkdir -p "build/$out"
            for cmd in droidline droidline-relay droidline-fakephone; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X github.com/KnifeLemon/Droidline/server/internal/hub.Version=$VERSION" \
                -o "build/$out/$cmd$ext" "./server/cmd/$cmd"
            done
            cp LICENSE README.md "build/$out/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$out.zip" "$out")
            else
              tar -C build -czf "dist/$out.tar.gz" "$out"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: build signed apk
        id: build
        working-directory: agent
        env:
          DROIDLINE_KEYSTORE_BASE64: ${{ secrets.DROIDLINE_KEYSTORE_BASE64 }}
          DROIDLINE_KEYSTORE_PASSWORD: ${{ secrets.DROIDLINE_KEYSTORE_PASSWORD }}
          DROIDLINE_KEY_ALIAS: ${{ secrets.DROIDLINE_KEY_ALIAS }}
          DROIDLINE_KEY_PASSWORD: ${{ secrets.DROIDLINE_KEY_PASSWORD }}
        run: |
          # Without the signing secrets there is no APK; the release still gets the binaries.
          if [ -z "$DROIDLINE_KEYSTORE_BASE64" ]; then
            echo "::warning::DROIDLINE_KEYSTORE_* secrets are not set; skipping the APK. Add them and re-run this job."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$DROIDLINE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export DROIDLINE_KEYSTORE="$RUNNER_TEMP/release.jks"
          export DROIDLINE_VERSION=${GITHUB_REF_NAME#v}
          export DROIDLINE_VERSION_CODE=$GITHUB_RUN_NUMBER
          ./gradlew assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/droidline-agent.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.signed == 'true'
        with:
          name: apk
          path: dist/droidline-agent.apk

  github-release:
    needs: [binaries, apk]
    # Runs whenever the binaries built, so a missing APK can be added by re-running apk and this job.
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # The "## <version>" section of CHANGELOG.md without its heading; wrapped list items joined into one line,
          # because GitHub keeps the file's line breaks in release notes.
          changes=$(awk -v v="$version" '$0 ~ "^## " v "[ \t]*$" {f=1; next} f && /^## / {exit} f' CHANGELOG.md \
            | perl -0pe 's/\n  (?=\S)/ /g; s/\A\s+|\s+\z//g')
          [ -n "$changes" ] || echo "::warning::CHANGELOG.md has no section for $version"
          # GitHub's generated notes: the merged pull requests, new contributors and the full changelog link.
          generated=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          prs=$(printf '%s\n' "$generated" | awk '/^## What.s Changed/ {f=1; next} /^## |^\*\*Full Changelog/ {f=0} f && /^\* /')
          tail=$(printf '%s\n' "$generated" | awk '/^## New Contributors|^\*\*Full Changelog/ {f=1} f')
          {
            echo "## What's Changed"
            [ -n "$changes" ] && printf '\n%s\n' "$changes"
            [ -n "$prs" ] && printf '\n### Pull requests\n\n%s\n' "$prs"
            [ -n "$tail" ] && printf '\n%s\n' "$tail"
          } > "$RUNNER_TEMP/notes.md"
          # A re-run finds the release already there: replace the files and the notes, and make sure it is published.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Droidline $version" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Droidline $version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi

  pypi:
    # Set the repository variable PYPI_PUBLISH=true after adding this repo as a trusted publisher on PyPI.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build sdk/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing: npm checks this workflow's OIDC identity (KnifeLemon/Droidline, release.yml), so there is
      # no token to store or renew. It needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: publish
        working-directory: sdk/node
        run: |
          npm ci
          npm publish --provenance --access public

  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Droidline relay: forwards encrypted lines between a PC and its phones
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/knifelemon/droidline-relay:${{ github.ref_name }}
            ghcr.io/knifelemon/droidline-relay:latest
