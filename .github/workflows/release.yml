name: release

# Push a tag like v0.1.0. Binaries, the signed APK and checksums go to a draft
# GitHub release; the SDKs go to PyPI and npm; the relay image goes to GHCR.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            out="droidline_${VERSION}_${os}_${arch}"
            mkdir -p "build/$out"
            for cmd in droidline droidline-relay droidline-fakephone; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X github.com/KnifeLemon/Droidline/server/internal/hub.Version=$VERSION" \
                -o "build/$out/$cmd$ext" "./server/cmd/$cmd"
            done
            cp LICENSE README.md "build/$out/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$out.zip" "$out")
            else
              tar -C build -czf "dist/$out.tar.gz" "$out"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: build signed apk
        working-directory: agent
        env:
          DROIDLINE_KEYSTORE_BASE64: ${{ secrets.DROIDLINE_KEYSTORE_BASE64 }}
          DROIDLINE_KEYSTORE_PASSWORD: ${{ secrets.DROIDLINE_KEYSTORE_PASSWORD }}
          DROIDLINE_KEY_ALIAS: ${{ secrets.DROIDLINE_KEY_ALIAS }}
          DROIDLINE_KEY_PASSWORD: ${{ secrets.DROIDLINE_KEY_PASSWORD }}
        run: |
          if [ -z "$DROIDLINE_KEYSTORE_BASE64" ]; then
            echo "Set the DROIDLINE_KEYSTORE_* secrets so the APK can be signed."
            exit 1
          fi
          echo "$DROIDLINE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export DROIDLINE_KEYSTORE="$RUNNER_TEMP/release.jks"
          export DROIDLINE_VERSION=${GITHUB_REF_NAME#v}
          export DROIDLINE_VERSION_CODE=$GITHUB_RUN_NUMBER
          ./gradlew assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/droidline-agent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/droidline-agent.apk

  github-release:
    needs: [binaries, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build sdk/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: publish
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm publish --provenance --access public

  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/knifelemon/droidline-relay:${{ github.ref_name }}
            ghcr.io/knifelemon/droidline-relay:latest
