[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "droidline"
version = "0.1.5"
description = "Android automation from Python: test your apps on real phones, script the tasks you repeat and run many phones at once. No ADB, no USB cable, no root."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Droidline contributors" }]
keywords = [
    "android", "android-automation", "mobile-automation", "ui-automation", "test-automation", "testing",
    "appium", "uiautomator", "adb", "accessibility", "rpa", "device-farm", "mcp", "pytest", "droidline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://droidline.dev"
Documentation = "https://droidline.dev/docs"
Repository = "https://github.com/KnifeLemon/Droidline"
Issues = "https://github.com/KnifeLemon/Droidline/issues"
Changelog = "https://github.com/KnifeLemon/Droidline/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/droidline"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
